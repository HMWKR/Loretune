    SubscriptionCancelCreate:
      type: object
      additionalProperties: false
      properties:
        expectedSubscriptionRevision:
          type: integer
          minimum: 1
        endAtPeriod:
          type: boolean
          default: true
        reason:
          type: string
          maxLength: 3000
      required:
      - expectedSubscriptionRevision
      - endAtPeriod
      description: Disable automatic renewal separately from workspace deletion. endAtPeriod=true preserves entitled
        access through the confirmed paid-period end. endAtPeriod=false requests policy-supported immediate cancellation
        and must show consequences before submit; it does not silently delete content, refund charges, or cancel
        already-accepted generation tasks. Provider confirmation may be asynchronous.
    SubscriptionResumeCreate:
      type: object
      additionalProperties: false
      properties:
        planId: &id011
          type: string
        billingPeriod:
          type: string
          enum:
          - month
          - year
        priceQuoteId: *id001
        expectedSubscriptionRevision:
          type: integer
          minimum: 1
        resumeMode:
          type: string
          enum:
          - revoke_scheduled_cancellation
          - new_paid_cycle
      required:
      - planId
      - billingPeriod
      - priceQuoteId
      - expectedSubscriptionRevision
      - resumeMode
      description: An explicit new consent action. Use the current price quote and current entitlement revision.
        Revoke a scheduled cancellation only while that same paid cycle remains eligible; a cancelled subscription
        requires a new verified payment cycle. An old paid callback cannot authorize a new cycle.
    SubscriptionState:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        revision:
          type: integer
          minimum: 1
        planId: *id011
        state:
          type: string
          enum:
          - pending
          - active
          - past_due
          - cancel_scheduled
          - cancelled
        billingCycleId: *id011
        periodEndsAt:
          type:
          - string
          - 'null'
          format: date-time
        endAtPeriod:
          type: boolean
        cancellationConfirmation:
          type: string
          enum:
          - none
          - pending
          - confirmed
          - failed
        entitlements:
          type: array
          items: *id011
      required:
      - id
      - revision
      - planId
      - state
      - billingCycleId
      - periodEndsAt
      - endAtPeriod
      - cancellationConfirmation
      - entitlements
