      - stableKey
    IpPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 5000
        defaultLocale:
          type: string
    EraCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        description:
          type: string
          maxLength: 5000
      required:
      - name
    BranchCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        parentBranchId:
          type: string
          format: uuid
        forkSnapshotId:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 3000
