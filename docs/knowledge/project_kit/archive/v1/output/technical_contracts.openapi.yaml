          type: string
          format: uuid
        permission:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
      - principalId
      - targetKind
      - targetId
      - permission
    IpCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        stableKey:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]{1,63}$
        defaultLocale:
          type: string
          default: ko-KR
        description:
          type: string
          maxLength: 5000
      required:
