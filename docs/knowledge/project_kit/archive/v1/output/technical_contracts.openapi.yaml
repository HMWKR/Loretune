  version: 0.1.0-design
  description: 2026-10-23. Aethon과 별개인 신규 제품. 미구현 설계 문서이며 외부 공급자 API가 아니다. core은 상세 계약 초안, planned는 완성형 범위의 경로/입출력/권한
    계약으로 구현 전에 응답 스키마를 구체화한다. 실제 성능·생성 품질·권한 구현 검증은 수행하지 않았다. 모든 변경은 tenant 및 object permission 확인 후 실행하며, generation/production/proposal
    approval과 canon approval을 분리한다.
