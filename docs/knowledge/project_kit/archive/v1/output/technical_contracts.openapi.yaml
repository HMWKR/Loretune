components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Required for billable commands and durable mutations. Same key+same canonical body replays; same
        key+different body => 409. Tenant and operation scoped.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag returned by the last read. Stale version => 412. No silent overwrite.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    LastEventId:
      name: Last-Event-ID
      in: header
      schema:
        type: string
      description: Resume after this job event sequence. Recheck current authorization. Expired history => 409 with
        snapshot refresh requirement.
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: ^\d+(\.\d{1,6})?$
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      required:
      - amount
      - currency
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryable: &id003
          type: boolean
        details: &id002
          type: object
          additionalProperties: true
          properties: {}
          description: Versioned domain JSON; validate against the referenced schema and permission policy in the
            domain service. Not free-form provider API input.
      required:
      - code
      - message
      - requestId
      - retryable
    Resource:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
        state:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        data: *id002
      required:
      - id
      - revision
      description: Planned non-core response envelope. Each module must publish a narrower concrete response schema
        before its implementation gate.
    ResourceList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        nextCursor:
          type:
          - string
          - 'null'
      required:
      - items
      - nextCursor
    JobAccepted:
      type: object
      additionalProperties: false
      properties:
        jobId:
          type: string
          format: uuid
        state:
          type: string
        reservationId:
          type:
          - string
          - 'null'
          format: uuid
        statusUrl:
          type: string
          format: uri-reference
        eventsUrl:
          type: string
          format: uri-reference
      required:
      - jobId
      - state
      - statusUrl
      - eventsUrl
    Job:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
        state:
          type: string
          enum:
          - draft
          - validated
          - reserved
          - queued
          - submitting
          - submission_unknown
          - running
          - validating_output
          - retry_wait
          - cancel_requested
          - cancelled
          - succeeded
          - failed
          - blocked
          - reconciliation_required
        stage:
          type: string
        progress:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        costStatus:
          type: string
          enum:
          - pending
          - confirmed
          - disputed
        reservedCost:
          $ref: '#/components/schemas/Money'
        confirmedCost:
          $ref: '#/components/schemas/Money'
        attempts:
          type: integer
          minimum: 0
        failure:
          oneOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
        snapshotId:
          type: string
          format: uuid
        revision:
          type: integer
          minimum: 1
      required:
      - id
      - kind
      - state
      - costStatus
      - attempts
      - revision
    JobEvent:
      type: object
      additionalProperties: false
      properties:
        sequence:
          type: integer
          minimum: 1
        jobId:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        eventType:
          type: string
        payload: *id002
      required:
      - sequence
      - jobId
      - occurredAt
      - eventType
      - payload
    WorkspaceCreate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        defaultLocale:
          type: string
          default: ko-KR
      required:
      - name
    WorkspacePatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        defaultLocale:
          type: string
      description: If-Match is required; at least one property must be supplied.
    MemberCreate:
      type: object
      additionalProperties: false
      properties:
        principalId:
          type: string
          format: uuid
        role:
          type: string
          enum:
          - owner
          - admin
          - producer
          - creator
          - reviewer
          - viewer
        ipIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
      required:
