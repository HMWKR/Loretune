      - role
    MemberPatch:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
          - owner
          - admin
          - producer
          - creator
          - reviewer
          - viewer
        ipIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAt:
          type:
          - string
          - 'null'
          format: date-time
    GrantCreate:
      type: object
      additionalProperties: false
      properties:
        principalId:
          type: string
          format: uuid
        targetKind:
          type: string
          enum:
          - ip
          - project
          - asset
