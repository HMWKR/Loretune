        and branch-inheritance validation are mandatory.
    EntityCreate:
      type: object
      additionalProperties: false
      properties:
        entityType:
          type: string
          enum:
          - human_person
          - fictional_character
          - group
          - costume
          - location
          - event
          - motif
          - prop
        stableKey:
          type: string
          maxLength: 100
        displayName:
          type: string
          maxLength: 200
        attributes: *id002
        schemaVersion:
          type: string
      required:
