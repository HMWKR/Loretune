      description: Provider-specific authenticated receiver, not a universal external webhook API. Actual headers/signature
        scheme/payload and event IDs must come from official processor documentation. Store the verified raw event
        durably and deduplicate (provider,eventId). Map customer/subscription/invoice IDs to trusted internal records;
        never trust a tenant ID from the body. Delayed, duplicate or out-of-order events cannot overwrite newer
        entitlement decisions. Reconcile authoritative current provider state, billingCycleId and internal revision;
        an old invoice-paid event is recorded in its historical cycle without silently reactivating a cancelled
        or resubscribed account. A browser success redirect does not grant entitlements. A failed payment retains
        drafts and existing history while blocking new chargeable work per disclosed policy. G1 minimum is required
        whenever automated payment is enabled, even if full FR-084 recovery UI is G2.
